name: Build release installers

# Implements: AD-072, AD-073, AD-074
# Deliberately never runs on ordinary pushes. A tag build produces a draft
# release; a manual run is a dry run that only attaches the installers to the
# workflow run, so the pipeline can be exercised without minting a version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The draft job creates the release; the platform jobs upload into it.
# Nothing here publishes a release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests and version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the package and its test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,gui]"

      - name: Resolve the release version
        id: version
        run: |
          project_version=$(python -c "from importlib.metadata import version; print(version('ibkr-to-xero'))")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$project_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version." \
                   "Bump the version, or retag, so the installers report the version they claim."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"
          echo "Building version $project_version"

      - name: Run the test suite
        # The statement-dependent tests skip themselves: examples/ is gitignored.
        run: pytest

  draft:
    name: Draft release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "IBKR to Xero ${{ needs.check.outputs.version }}"
          fi

  windows:
    name: Windows installer
    needs: [check, draft]
    # draft is skipped on a dry run, which would normally skip this job too.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,gui]" pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1 -Version ${{ needs.check.outputs.version }}

      - name: Upload to the draft release
        if: needs.check.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # PowerShell does not expand wildcards for native commands, so the
        # asset has to be resolved before gh sees it.
        run: |
          $asset = Get-ChildItem release\IBKR-to-Xero-Setup-*-windows-x64.exe | Select-Object -First 1
          gh release upload $env:GITHUB_REF_NAME $asset.FullName --clobber

      - name: Attach the installer to the workflow run
        if: needs.check.outputs.release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release/IBKR-to-Xero-Setup-*-windows-x64.exe

  # The packages are signed and notarised on every run, dry runs included, so
  # a dry run exercises exactly what a release ships. The identities are
  # Sergei Kulik's Developer ID pair (team Q4KANR5AC3), selected by SHA-1
  # because older certificates share their common names; they expire
  # 2027-12-09, when the fingerprints here and the secrets below are renewed.
  # Secrets: MACOS_CERT_P12 (base64 .p12 holding both identities),
  # MACOS_CERT_PASSWORD, and an App Store Connect API key for notarytool:
  # APPLE_API_KEY_P8 (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER_ID.
  # Apple silicon only; Intel Macs are not supported.
  macos:
    name: macOS installer (arm64)
    needs: [check, draft]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.draft.result != 'failure' }}
    env:
      MACOS_APP_IDENTITY: 59969450EC2C4ED8F56CB8514CCF70ED3A15E8F8        # Developer ID Application
      MACOS_INSTALLER_IDENTITY: 4D07A535715B60365B22BF04FC22E4007598836A  # Developer ID Installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev,gui]' pyinstaller

      - name: Keychain with the signing identities
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are not set; refusing to build an unsigned package."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v "$KEYCHAIN"

      - name: Build and sign installer
        run: |
          chmod +x packaging/macos/build-package.sh
          packaging/macos/build-package.sh "${{ needs.check.outputs.version }}"

      - name: Notarise, staple, assess
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::error::APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER_ID are not set; cannot notarise."
            exit 1
          fi
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          PKG=$(ls release/IBKR-to-Xero-*-macos-*.pkg)
          xcrun notarytool submit "$PKG" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --wait --timeout 60m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['status'])" "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
            echo "::error::notarisation: $status"; exit 1
          fi
          # staple validates as it goes ("The staple and validate action
          # worked!"); a separate `stapler validate` only adds another round
          # trip to Apple's ticket server, which once dropped the connection.
          xcrun stapler staple "$PKG"
          spctl --assess --type install -vvv "$PKG"

      # The hardened runtime is the likeliest thing to break a PyInstaller
      # build: the onefile CLI unpacks and loads its libraries at run time, and
      # the GUI loads Qt's. Run both from the shipped package's payload.
      - name: Smoke-test the packaged CLI and app
        run: |
          PKG=$(ls release/IBKR-to-Xero-*-macos-*.pkg)
          EXPANDED="$RUNNER_TEMP/expanded"
          pkgutil --expand-full "$PKG" "$EXPANDED"
          "$EXPANDED/IBKR-to-Xero-CLI.pkg/Payload/usr/local/bin/ibkr2xero" --help
          APP_BIN="$EXPANDED/IBKR-to-Xero-GUI.pkg/Payload/Applications/IBKR to Xero.app/Contents/MacOS/IBKR to Xero"
          "$APP_BIN" > "$RUNNER_TEMP/gui.log" 2>&1 &
          GUI_PID=$!
          sleep 20
          if ! kill -0 "$GUI_PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/gui.log"
            echo "::error::The packaged app exited within 20 seconds of launch."
            exit 1
          fi
          kill "$GUI_PID"
          cat "$RUNNER_TEMP/gui.log"

      - name: Clean up the signing material
        if: always()
        run: |
          [ -n "$MACOS_KEYCHAIN" ] && security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload to the draft release
        if: needs.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/IBKR-to-Xero-*-macos-*.pkg --clobber

      - name: Attach the installer to the workflow run
        if: needs.check.outputs.release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer-arm64
          path: release/IBKR-to-Xero-*-macos-*.pkg
